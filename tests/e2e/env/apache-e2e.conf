# WordPress path-based multisite rewrites, held in Apache config rather than an
# .htaccess in the repo root, so the environment adds no file to the app tree.
#
# SECURITY: the webroot is the REPO ROOT (docker-compose.yml:55), so without the
# deny rules below Apache serves .git/config, the Playwright storageState files
# (live admin session cookies), the baseline SQL dump, and claudedocs/. All four
# were verified returning HTTP 200 before these rules were added.
# Findings W1/W2, red-team-b.

# --- Deny non-application paths BEFORE the WordPress rules ---------------

# Any dotfile or dot-directory at any depth: .git, .github, .env, .DS_Store
<DirectoryMatch "^/var/www/html/(.*/)?\.[^/]+">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Test scaffolding: storageState JSON with live session cookies, SQL dumps,
# specs, node_modules. Nothing under tests/ is ever a legitimate HTTP target.
<Directory /var/www/html/tests>
    Require all denied
</Directory>

# Research and documentation output. claudedocs/ documents the app's own
# security weaknesses; serving it from the app under test is self-defeating.
<Directory /var/www/html/claudedocs>
    Require all denied
</Directory>
<Directory /var/www/html/docs>
    Require all denied
</Directory>
<Directory /var/www/html/linting>
    Require all denied
</Directory>

# Dependency and config files. Denied globally, then re-granted under the three
# WordPress trees below, because core and plugins legitimately ship .json assets
# and Apache resolves the longest-matching <Directory> last.
<FilesMatch "\.(sql|md|dist|neon|lock|json|yml|yaml|sh|bak|csv|log|txt|xml|ini|pdf|bat|sample)$">
    Require all denied
</FilesMatch>

# wp-config.php holds the DB credentials. PHP executes rather than serves it, so
# this is defence in depth against a future mis-set handler.
<Files "wp-config.php">
    Require all denied
</Files>
<Files "wp-config-sample.php">
    Require all denied
</Files>

# --- Data directories: deny wholesale ------------------------------------
# Root-cause fix for the extension-allowlist hole found at Gate D: denying by
# extension is whack-a-mole (.txt slipped through and served an auth token from
# /wp-content/log/logapi.txt, 200, 297 bytes). These directories hold logs,
# cached query results and scanned requisitions/result PDFs. None is ever a
# legitimate direct HTTP target -- the app serves result PDFs through the
# ?tr_action=ci_results_pdf handler, not by direct file access, so denying
# direct access also closes the filename-based check flagged in S-POR-07.
<Directory /var/www/html/wp-content/log>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/cache>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/paperwork>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/doctor>
    Require all denied
</Directory>
<Directory /var/www/html/wp-content/ci-dev-logs>
    Require all denied
</Directory>

# Re-grant the asset extensions inside the WordPress trees only.
<Directory /var/www/html/wp-admin>
    <FilesMatch "\.(json|md)$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory /var/www/html/wp-includes>
    <FilesMatch "\.(json|md)$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory /var/www/html/wp-content>
    <FilesMatch "\.(json|md)$">
        Require all granted
    </FilesMatch>
</Directory>

# --- WordPress ------------------------------------------------------------
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]

    # add a trailing slash to /wp-admin
    RewriteRule ^([_0-9a-zA-Z-]+/)?wp-admin$ $1wp-admin/ [R=301,L]

    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^([_0-9a-zA-Z-]+/)?(wp-(content|admin|includes).*) $2 [L]
    RewriteRule ^([_0-9a-zA-Z-]+/)?(.*\.php)$ $2 [L]
    RewriteRule . index.php [L]
</Directory>
