# Edge proxy. It exists only because Docker will not publish a host port from a
# network marked `internal: true` (measured: connection refused). The proxy sits
# on both networks; the app container stays on the internal one and keeps no
# route off the host. There is no open-forward here - the only upstream is the
# app itself.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_redirect off;
    }
}
